<div style="padding: 20px; font-family: Arial;">
  <h2>Motorgarázs - Járműpark</h2>
  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div *ngFor="let v of (vehicles$ | async)" style="border: 1px solid #ccc; padding: 15px; width: 260px; border-radius: 6px;">
      <img [src]="v.pictureUrl" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px;">
      <h3>{{v.brand}} {{v.model}}</h3>
      <p>Évjárat: {{v.year}}</p>
      <button [routerLink]="['/uj']" [queryParams]="{ vehicleId: v.id }" style="background: green; color: white; border: none; padding: 6px; cursor: pointer; margin-right: 5px;">Szerelés rögzítése</button>
      <button [routerLink]="['/naplo']" [queryParams]="{ vehicleId: v.id }" style="background: blue; color: white; border: none; padding: 6px; cursor: pointer;">Szerviz</button>
    </div>
  </div>
</div>
